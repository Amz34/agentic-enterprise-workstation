name: Enterprise Agent Pre-Flight & Governance
on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  agent-governance-audit:
    name: Dual-Model & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Secret Leak & AST Diff Scan
        run: |
          echo "Scanning git diff for credential patterns and sensitive markers..."
          git diff origin/main...HEAD | grep -iE "(AWS_SECRET|PRIVATE_KEY|BEGIN RSA|password\s*=|api[_-]?key\s*=)" && {
            echo "::error::Potential sensitive credentials detected in PR diff!"
            exit 1
          } || echo "No exposed credentials found."

      - name: Execute QA Test Harness
        run: |
          python -m unittest discover tests
